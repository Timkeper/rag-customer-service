<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智答 · 坐席工作台</title>
<style>
  :root {
    --brand: #0d9488; --brand-deep: #0f766e; --brand-grad: linear-gradient(135deg, #14b8a6, #0f766e);
    --ink: #17272b; --ink-2: #5b6b70; --ink-3: #97a6ab;
    --bg: #f3f7f6; --card: #fff; --line: #e3ebe9;
    --radius: 16px; --shadow: 0 8px 30px rgba(15,118,110,.08), 0 2px 6px rgba(23,39,43,.04);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--ink); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .bg-deco { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .bg-deco::before { content: ""; position: absolute; width: 400px; height: 400px; border-radius: 50%; background: #bfe8e0; filter: blur(90px); opacity: .35; top: -140px; left: -100px; }

  header {
    position: relative; z-index: 2; background: var(--brand-grad); color: #fff; padding: 14px 22px;
    display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 24px rgba(15,118,110,.25);
  }
  header .logo { width: 40px; height: 40px; border-radius: 13px; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.25); display: flex; align-items: center; justify-content: center; font-size: 20px; }
  header h1 { font-size: 16px; font-weight: 700; letter-spacing: .5px; }
  header .who { margin-left: auto; font-size: 13px; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.22); padding: 6px 14px; border-radius: 18px; }
  .wrap { position: relative; z-index: 1; flex: 1; display: flex; overflow: hidden; }

  #loginScreen { position: relative; z-index: 1; flex: 1; display: flex; align-items: center; justify-content: center; }
  .card { background: var(--card); border-radius: 24px; padding: 40px 36px; width: 380px; box-shadow: var(--shadow); text-align: center; animation: rise .5s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .card .icon { width: 70px; height: 70px; margin: 0 auto 14px; border-radius: 22px; background: linear-gradient(135deg, #d9f2ee, #c2e8e1); display: flex; align-items: center; justify-content: center; font-size: 32px; }
  .card h2 { font-size: 18px; margin-bottom: 20px; }
  .card input { width: 100%; padding: 13px 16px; border: 1.5px solid var(--line); border-radius: 13px; font-size: 14px; margin-bottom: 12px; outline: none; background: #fafcfc; transition: all .2s; }
  .card input:focus { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(13,148,136,.12); background: #fff; }
  .card button { width: 100%; padding: 13px; background: var(--brand-grad); color: #fff; border: none; border-radius: 13px; font-size: 14px; cursor: pointer; font-weight: 700; box-shadow: 0 8px 18px rgba(15,118,110,.3); }
  .card button:hover { transform: translateY(-1px); }
  .card .err { color: #e0566b; font-size: 13px; margin-top: 10px; min-height: 18px; }
  .card .demo { margin-top: 14px; font-size: 12px; color: var(--ink-3); }

  #main { flex: 1; display: none; }
  .list { width: 400px; background: var(--card); border-right: 1px solid var(--line); overflow-y: auto; display: flex; flex-direction: column; }
  .list .bar { padding: 14px 16px; display: flex; gap: 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--card); z-index: 2; }
  .list .bar button { flex: 1; padding: 8px; border: 1px solid var(--line); background: #fff; border-radius: 10px; font-size: 12px; cursor: pointer; color: var(--ink-2); transition: all .15s; }
  .list .bar button.on { background: var(--brand-grad); color: #fff; border-color: transparent; box-shadow: 0 4px 10px rgba(15,118,110,.25); }
  .ticket { padding: 16px 18px; border-bottom: 1px solid #eef4f2; cursor: pointer; transition: background .15s; }
  .ticket:hover { background: #f4faf8; }
  .ticket.sel { background: linear-gradient(135deg, #e8f7f3, #f0faf7); box-shadow: inset 3px 0 0 var(--brand); }
  .ticket .tid { font-size: 11px; color: var(--ink-3); font-family: Consolas, monospace; }
  .ticket .reason { font-size: 14px; font-weight: 600; margin: 4px 0 6px; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 10px; border-radius: 12px; font-weight: 600; }
  .badge.待接管 { background: #fde8e8; color: #c0392b; }
  .badge.处理中 { background: #fdf3dc; color: #b7791f; }
  .badge.已解决 { background: #def7ec; color: #0e9f6e; }
  .badge.紧急 { background: #fde8e8; color: #c0392b; margin-left: 6px; }
  .badge.普通 { background: #eef2f1; color: var(--ink-3); margin-left: 6px; }

  .detail { flex: 1; display: flex; flex-direction: column; background: var(--card); min-width: 0; }
  .detail .empty { flex: 1; display: flex; flex-direction: column; gap: 10px; align-items: center; justify-content: center; color: var(--ink-3); font-size: 14px; }
  .detail .empty .big { font-size: 44px; opacity: .5; }
  .d-head { padding: 18px 22px; border-bottom: 1px solid var(--line); }
  .d-head h3 { font-size: 15px; margin-bottom: 6px; font-family: Consolas, monospace; }
  .summary { margin-top: 12px; background: linear-gradient(135deg, #ecf8f5, #f2fbf8); border-left: 3px solid var(--brand); border-radius: 10px; padding: 12px 14px; font-size: 13px; color: #115e59; line-height: 1.7; }
  .d-actions { padding: 12px 22px; display: flex; gap: 10px; border-bottom: 1px solid var(--line); }
  .d-actions button { padding: 9px 20px; border-radius: 10px; border: none; font-size: 13px; cursor: pointer; font-weight: 700; transition: transform .15s; }
  .btn-take { background: var(--brand-grad); color: #fff; box-shadow: 0 4px 12px rgba(15,118,110,.3); }
  .btn-resolve { background: #def7ec; color: #0e9f6e; }
  .d-actions button:hover { transform: translateY(-1px); }
  .convo { flex: 1; overflow-y: auto; padding: 18px 22px; display: flex; flex-direction: column; gap: 12px; background: #f8fbfa; }
  .cm { max-width: 72%; padding: 10px 14px; border-radius: 14px; font-size: 13.5px; line-height: 1.7; white-space: pre-wrap; }
  .cm.user { align-self: flex-end; background: var(--brand-grad); color: #fff; border-bottom-right-radius: 4px; }
  .cm.assistant { align-self: flex-start; background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .cm.human_agent { align-self: flex-start; background: #fff8e6; border: 1px solid #f5df9a; color: #6b4d0f; border-bottom-left-radius: 4px; }
  .reply-bar { display: flex; gap: 10px; padding: 14px 22px 18px; border-top: 1px solid var(--line); background: #fff; }
  .reply-bar input { flex: 1; padding: 12px 16px; border: 1.5px solid var(--line); border-radius: 22px; font-size: 14px; outline: none; transition: border-color .2s; }
  .reply-bar input:focus { border-color: var(--brand); }
  .reply-bar button { padding: 0 22px; background: var(--brand-grad); color: #fff; border: none; border-radius: 20px; cursor: pointer; font-weight: 600; box-shadow: 0 4px 12px rgba(15,118,110,.3); }

  /* ===== 手机适配：列表/详情上下堆叠 ===== */
  @media (max-width: 720px) {
    .wrap { flex-direction: column; }
    .list { width: 100%; max-height: 42vh; border-right: none; border-bottom: 1px solid var(--line); }
    .detail .empty .big { font-size: 32px; }
  }
</style>
</head>
<body>

<div class="bg-deco"></div>

<header>
  <div class="logo">🎧</div>
  <h1>智答 · 坐席工作台</h1>
  <div class="who" id="who"></div>
</header>

<div id="loginScreen">
  <div class="card">
    <div class="icon">🎧</div>
    <h2>坐席登录</h2>
    <input id="agentName" placeholder="坐席昵称（如：小王）">
    <input id="password" type="password" placeholder="工作台密码">
    <button onclick="login()">登 录</button>
    <div class="err" id="loginErr"></div>
    <div class="demo">演示密码：zhida2026</div>
  </div>
</div>

<div class="wrap" id="main">
  <div class="list">
    <div class="bar">
      <button class="on" data-st="" onclick="setFilter(this)">全部</button>
      <button data-st="待接管" onclick="setFilter(this)">待接管</button>
      <button data-st="处理中" onclick="setFilter(this)">处理中</button>
      <button data-st="已解决" onclick="setFilter(this)">已解决</button>
    </div>
    <div id="ticketList"></div>
  </div>
  <div class="detail" id="detail"><div class="empty"><div class="big">🗂</div>选择左侧工单，查看 AI 摘要与完整对话</div></div>
</div>

<script>
let token = '', agentName = '', curTicket = null, filter = '', timer = null;

async function login() {
  agentName = document.getElementById('agentName').value.trim() || '坐席';
  const pwd = document.getElementById('password').value;
  const r = await fetch('/api/console/login', { method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ password: pwd, agent_name: agentName }) });
  if (!r.ok) { document.getElementById('loginErr').textContent = '密码错误'; return; }
  const d = await r.json();
  token = d.token;
  document.getElementById('who').textContent = '👤 ' + agentName;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('main').style.display = 'flex';
  refresh();
  timer = setInterval(refresh, 5000);
}

function setFilter(btn) {
  document.querySelectorAll('.bar button').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  filter = btn.dataset.st;
  refresh();
}

async function refresh() {
  const r = await fetch('/api/tickets' + (filter ? '?status=' + filter : ''), { headers: { 'X-Token': token } }).then(r => r.json());
  const el = document.getElementById('ticketList');
  el.innerHTML = '';
  if (!(r.tickets || []).length) {
    el.innerHTML = '<div style="padding:30px;text-align:center;color:#97a6ab;font-size:13px">暂无工单</div>';
  }
  (r.tickets || []).forEach(t => {
    const d = document.createElement('div');
    d.className = 'ticket' + (curTicket === t.ticket_id ? ' sel' : '');
    d.onclick = () => showDetail(t);
    d.innerHTML = `<div class="tid">${t.ticket_id} · ${t.created_at || ''}</div>
      <div class="reason">${t.reason || ''}</div>
      <span class="badge ${t.status}">${t.status}</span><span class="badge ${t.priority}">${t.priority}</span>`;
    el.appendChild(d);
  });
}

async function showDetail(t) {
  curTicket = t.ticket_id;
  refresh();
  const el = document.getElementById('detail');
  let convHtml = '<div class="empty"><div class="big">💬</div>无对话记录</div>';
  if (t.session_id) {
    const m = await fetch('/api/messages/' + t.session_id).then(r => r.json());
    convHtml = (m.messages || []).map(x =>
      `<div class="cm ${x.role}">${x.role === 'human_agent' ? '👨‍💼 ' : (x.role === 'user' ? '👤 ' : '🤖 ')}${esc(x.content)}</div>`).join('');
  }
  el.innerHTML = `
    <div class="d-head">
      <h3>${t.ticket_id} · ${esc(t.reason || '')}</h3>
      <span class="badge ${t.status}">${t.status}</span><span class="badge ${t.priority}">${t.priority}</span>
      ${t.assigned_to ? ` · 坐席：${esc(t.assigned_to)}` : ''}
      <div class="summary"><b>🤖 AI 摘要：</b>${esc(t.summary || '（无）')}</div>
    </div>
    <div class="d-actions">
      ${t.status === '待接管' ? '<button class="btn-take" onclick="takeTicket()">接管工单</button>' : ''}
      ${t.status === '处理中' ? '<button class="btn-resolve" onclick="resolveTicket()">标记解决</button>' : ''}
    </div>
    <div class="convo">${convHtml}</div>
    ${t.status === '处理中' ? `<div class="reply-bar">
      <input id="replyInput" placeholder="以人工身份回复买家（直接出现在买家对话中）" onkeydown="if(event.key==='Enter')reply()">
      <button onclick="reply()">发送</button></div>` : ''}`;
}

async function takeTicket() {
  await api('/api/tickets/take', { ticket_id: curTicket, agent_name: agentName });
  refresh(); const t = (await fetch('/api/tickets', { headers: { 'X-Token': token } }).then(r => r.json())).tickets.find(x => x.ticket_id === curTicket);
  if (t) showDetail(t);
}
async function resolveTicket() {
  await api('/api/tickets/resolve', { ticket_id: curTicket });
  refresh();
}
async function reply() {
  const input = document.getElementById('replyInput');
  const text = input.value.trim();
  if (!text) return;
  await api('/api/tickets/reply', { ticket_id: curTicket, agent_name: agentName, content: text });
  input.value = '';
  const t = (await fetch('/api/tickets', { headers: { 'X-Token': token } }).then(r => r.json())).tickets.find(x => x.ticket_id === curTicket);
  if (t) showDetail(t);
}
async function api(url, body) {
  return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Token': token }, body: JSON.stringify(body) }).then(r => r.json());
}
function esc(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
</script>
</body>
</html>
