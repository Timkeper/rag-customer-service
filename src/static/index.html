<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智答 · 售后客服</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }
  header { background: linear-gradient(135deg, #2563eb, #1e40af); color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 10px; }
  header .logo { width: 36px; height: 36px; background: rgba(255,255,255,.2); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  header h1 { font-size: 17px; font-weight: 600; }
  header .sub { font-size: 12px; opacity: .85; }
  header .orders { margin-left: auto; font-size: 12px; background: rgba(255,255,255,.15); padding: 4px 10px; border-radius: 12px; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 验证卡片 */
  #verifyScreen { flex: 1; display: flex; align-items: center; justify-content: center; }
  .card { background: #fff; border-radius: 16px; padding: 32px; width: 380px; box-shadow: 0 4px 24px rgba(0,0,0,.08); text-align: center; }
  .card .icon { font-size: 44px; margin-bottom: 8px; }
  .card h2 { font-size: 18px; color: #1e293b; margin-bottom: 6px; }
  .card p { font-size: 13px; color: #64748b; margin-bottom: 20px; line-height: 1.6; }
  .card input { width: 100%; padding: 12px 14px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 15px; margin-bottom: 12px; outline: none; }
  .card input:focus { border-color: #2563eb; }
  .card button { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 10px; font-size: 15px; cursor: pointer; font-weight: 600; }
  .card button:hover { background: #1d4ed8; }
  .card .err { color: #dc2626; font-size: 13px; margin-top: 10px; min-height: 18px; }
  .card .demo { margin-top: 16px; font-size: 12px; color: #94a3b8; background: #f8fafc; border-radius: 8px; padding: 8px; line-height: 1.7; }

  /* 聊天区 */
  #chatScreen { flex: 1; display: none; flex-direction: column; }
  #msgs { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: #fff; color: #1e293b; border-bottom-left-radius: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .msg.agent { align-self: flex-start; background: #fef9c3; color: #713f12; border: 1px solid #fde047; border-bottom-left-radius: 4px; }
  .msg .toolhint { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: #2563eb; background: #eff6ff; border-radius: 10px; padding: 3px 10px; margin-bottom: 6px; }
  .receipt { margin-top: 8px; background: #f0fdf4; border: 1px solid #86efac; border-radius: 10px; padding: 10px 12px; font-size: 13px; color: #166534; }
  .receipt .undo { margin-top: 6px; }
  .receipt .undo button { background: #16a34a; color: #fff; border: none; border-radius: 6px; padding: 4px 12px; font-size: 12px; cursor: pointer; }
  .typing { align-self: flex-start; color: #94a3b8; font-size: 13px; padding: 4px 10px; }
  .typing .dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "·"; } 50% { content: "··"; } 75% { content: "···"; } }

  #inputBar { display: flex; gap: 10px; padding: 12px 16px; background: #fff; border-top: 1px solid #e2e8f0; }
  #inputBar input { flex: 1; padding: 12px 16px; border: 1.5px solid #e2e8f0; border-radius: 22px; font-size: 14px; outline: none; }
  #inputBar input:focus { border-color: #2563eb; }
  #inputBar button { padding: 0 22px; background: #2563eb; color: #fff; border: none; border-radius: 22px; font-size: 14px; cursor: pointer; }
  #inputBar button:disabled { background: #94a3b8; }
</style>
</head>
<body>

<header>
  <div class="logo">🤖</div>
  <div>
    <h1>智答 · 售后客服</h1>
    <div class="sub">额度内直接为您办理 · 全程可审计可撤销</div>
  </div>
  <div class="orders" id="orderBadge" style="display:none"></div>
</header>

<!-- 验证屏 -->
<div id="verifyScreen">
  <div class="card">
    <div class="icon">📦</div>
    <h2>验证您的订单</h2>
    <p>为了保护您的账户安全，请验证订单信息<br>验证后即可查询与办理名下订单</p>
    <input id="phoneInput" placeholder="下单手机号后四位" maxlength="4" inputmode="numeric">
    <input id="orderInput" placeholder="订单号（如 A100002）">
    <button onclick="doVerify()">开始咨询</button>
    <div class="err" id="verifyErr"></div>
    <div class="demo">演示账号：尾号 <b>8002</b> + 订单 <b>A100002</b><br>或 尾号 <b>8001</b> + <b>A100001</b>（大额单，体验转人工）</div>
  </div>
</div>

<!-- 聊天屏 -->
<div id="chatScreen">
  <div id="msgs"></div>
  <div id="inputBar">
    <input id="chatInput" placeholder="输入您的问题，如：我的快递到哪了" onkeydown="if(event.key==='Enter')sendMsg()">
    <button id="sendBtn" onclick="sendMsg()">发送</button>
  </div>
</div>

<script>
let sessionId = null;
let busy = false;

const toolNames = {
  query_order_status: '正在查询订单物流…', query_return_policy: '正在检索售后政策…',
  submit_return_request: '正在提交申请…', check_refund_progress: '正在查询退款进度…',
  execute_service_action: '正在为您办理…', undo_service_action: '正在撤销…',
  escalate_to_human: '正在转接人工…'
};

async function doVerify() {
  const phone = document.getElementById('phoneInput').value.trim();
  const order = document.getElementById('orderInput').value.trim();
  const err = document.getElementById('verifyErr');
  err.textContent = '';
  const r = await fetch('/api/verify', { method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ phone_last4: phone, order_id: order }) }).then(r => r.json());
  if (!r.success) { err.textContent = r.error; return; }
  sessionId = r.session_id;
  const badge = document.getElementById('orderBadge');
  badge.style.display = 'block';
  badge.textContent = '✅ ' + r.orders.map(o => o.order_id).join(' · ');
  document.getElementById('verifyScreen').style.display = 'none';
  const cs = document.getElementById('chatScreen');
  cs.style.display = 'flex';
  addMsg('bot', '您好，我是智能售后助手「小答」👋\n已验证您名下订单，可以直接问我：\n• 我的快递到哪了\n• 这个能退货吗 / 帮我退款\n• 退款到账了吗\n\n小额退款我可以直接为您办理，大额或复杂情况会转人工（无需重复描述问题）。');
  loadHistory();
}

async function loadHistory() {
  const r = await fetch('/api/messages/' + sessionId).then(r => r.json());
  (r.messages || []).forEach(m => addMsg(m.role === 'user' ? 'user' : (m.role === 'human_agent' ? 'agent' : 'bot'), m.content));
}

function addMsg(role, text, extra) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  if (extra && extra.tool) {
    const hint = document.createElement('div');
    hint.className = 'toolhint';
    hint.textContent = '🔧 ' + toolNames[extra.tool] + '（已完成）';
    div.prepend(hint);
  }
  document.getElementById('msgs').appendChild(div);
  scrollBottom();
  return div;
}

function scrollBottom() { document.getElementById('msgs').scrollTop = 1e9; }

async function sendMsg() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || busy || !sessionId) return;
  busy = true;
  document.getElementById('sendBtn').disabled = true;
  input.value = '';
  addMsg('user', text);

  const typing = document.createElement('div');
  typing.className = 'typing msg bot';
  typing.innerHTML = '<span class="dots">思考中</span>';
  document.getElementById('msgs').appendChild(typing);
  scrollBottom();

  try {
    const resp = await fetch('/api/chat', { method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ session_id: sessionId, message: text }) });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const evt = JSON.parse(line.slice(6));
        if (evt.type === 'tool') {
          typing.innerHTML = '🔧 ' + (toolNames[evt.name] || evt.name);
        } else if (evt.type === 'final') {
          typing.remove();
          const d = evt.data;
          const div = addMsg('bot', d.reply);
          if (d.receipt && d.receipt.approved) {
            const rc = document.createElement('div');
            rc.className = 'receipt';
            rc.innerHTML = `<b>📋 办结回执</b> ${d.receipt.action_id}<br>${d.receipt.message}<div class="undo"><button onclick="undoAction('${d.receipt.action_id}')">撤销本次办理</button> <span style="font-size:11px;opacity:.8">${d.receipt.undo_deadline} 前</span></div>`;
            div.appendChild(rc);
          }
          if (d.ticket_id) {
            const tk = document.createElement('div');
            tk.className = 'receipt'; tk.style.background = '#fffbeb'; tk.style.borderColor = '#fde047'; tk.style.color = '#92400e';
            tk.textContent = `🎫 已创建人工工单 ${d.ticket_id}，坐席将带着对话摘要接入，无需重复描述。`;
            div.appendChild(tk);
          }
        }
      }
    }
    typing.remove();
  } catch (e) {
    typing.remove();
    addMsg('bot', '网络异常，请稍后重试。');
  }
  busy = false;
  document.getElementById('sendBtn').disabled = false;
}

async function undoAction(actionId) {
  document.getElementById('chatInput').value = `撤销 ${actionId}`;
  sendMsg();
}
</script>
</body>
</html>
